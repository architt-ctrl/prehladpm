<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D náhľad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f5f3ef; --bg2:#fff; --bg3:#f0ede8;
      --border:#e4dfd8;
      --text:#2c2825; --text2:#6b6460; --text3:#9e9590;
      --green:#1e7a4a; --grn-bg:#f0faf5; --grn-bd:#b8e6cc;
      --blue:#1a5fa0; --blu-bg:#f0f6fd; --blu-bd:#b8d4f0;
      --red:#c0392b; --red-bg:#fdf2f1; --red-bd:#f5c6c2;
      --sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow:hidden}

    .top{background:var(--text);color:#f5f3ef;padding:12px 18px;display:flex;align-items:center;gap:8px;position:relative;z-index:20}
    .top-logo{font-size:16px;font-weight:600}
    .top-sub{font-size:13px;color:rgba(245,243,239,.45)}
    .top-name{margin-left:auto;font-size:14px;font-weight:500}

    #viewport-wrap{position:absolute;top:49px;left:0;right:0;bottom:0}
    #container{position:absolute;inset:0}

    .panel{position:absolute;top:12px;left:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;z-index:10;max-width:calc(100% - 24px);box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .panel-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .pbtn{padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
    .pbtn:hover{background:var(--border)}
    .pbtn.hidden-cat{opacity:.4}
    .panel-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px;width:100%}

    .status-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:15}
    .status-icon{font-size:44px}
    .status-wrap p{color:var(--text2);font-size:14px;text-align:center;max-width:320px;padding:0 16px}
    .status-wrap .err{color:var(--red)}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="top">
  <span class="top-logo">Tornyos Architects</span>
  <span class="top-sub">· 3D náhľad</span>
  <span class="top-name" id="topName"></span>
</div>

<div id="viewport-wrap">
  <div id="container"></div>

  <div class="panel" id="panel" style="display:none">
    <div class="panel-row">
      <button class="pbtn" id="btnClip">✂️ Rez (dvojklik v modeli)</button>
      <button class="pbtn" id="btnClearClip">Zmazať rezy</button>
    </div>
    <div class="panel-label">Vrstvy</div>
    <div class="panel-row" id="cats"></div>
  </div>

  <div class="status-wrap" id="status">
    <div class="spinner" id="spinnerIcon"></div>
    <div class="status-icon" id="statusIcon" style="display:none"></div>
    <p id="statusText">Načítavam model...</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@3.1.2/+esm",
    "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.77/+esm",
    "@thatopen/fragments": "https://cdn.jsdelivr.net/npm/@thatopen/fragments@3.4.7/+esm",
    "@thatopen/components": "https://cdn.jsdelivr.net/npm/@thatopen/components@3.4.8/+esm",
    "three/addons/lines/Line2.js": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/lines/Line2.js",
    "three/addons/lines/LineGeometry.js": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/lines/LineGeometry.js",
    "three/addons/lines/LineMaterial.js": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/lines/LineMaterial.js",
    "three/addons/lines/LineSegments2.js": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/lines/LineSegments2.js",
    "three/addons/lines/LineSegmentsGeometry.js": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/lines/LineSegmentsGeometry.js"
  }
}
</script>
<script type="module">
const DRIVE_API_KEY = 'AIzaSyDx3fr6pErdbnQMgDuKIBRHHlzdEEqhAN0';

const params = new URLSearchParams(location.search);
const cislo = params.get('cislo');
const nazov = params.get('nazov') || '';
document.getElementById('topName').textContent = nazov;
document.title = nazov ? (nazov + ' — 3D náhľad') : '3D náhľad';

const SB_URL = 'https://cfjkomqxzqflotrqxfyl.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmamtvbXF4enFmbG90cnF4ZnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NTM1NjksImV4cCI6MjA5MzUyOTU2OX0.GUnw0I0wDrkIwaJ15TnpF_8zghW_8yIM_MZlyLF1dH8';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

function setStatus(text, isError) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusText').className = isError ? 'err' : '';
  document.getElementById('spinnerIcon').style.display = isError ? 'none' : '';
  document.getElementById('statusIcon').style.display = isError ? '' : 'none';
  document.getElementById('statusIcon').textContent = isError ? '⚠️' : '';
}
function hideStatus() { document.getElementById('status').style.display = 'none'; }

async function main() {
  if (!cislo) { setStatus('Chýba číslo projektu v odkaze (cislo).', true); return; }

  setStatus('Vyhľadávam aktuálny model...');
  let fileId;
  try {
    const { data } = await sb.from('project_folders').select('ifc_file_id').eq('cislo', cislo).maybeSingle();
    fileId = data?.ifc_file_id;
  } catch (e) {}
  if (!fileId) {
    setStatus('Pre tento projekt ešte nebol nájdený žiadny IFC model — treba ho najprv nájsť v dashboarde (🧊 tlačidlo pri projekte).', true);
    return;
  }

  const THREE = await import('three');
  const OBC = await import('@thatopen/components');

  const container = document.getElementById('container');
  const components = new OBC.Components();
  const worlds = components.get(OBC.Worlds);
  const world = worlds.create();
  world.scene = new OBC.SimpleScene(components);
  world.renderer = new OBC.SimpleRenderer(components, container);
  world.camera = new OBC.SimpleCamera(components);
  components.init();
  world.scene.setup();
  world.scene.three.background = new THREE.Color('#f5f3ef');

  const grids = components.get(OBC.Grids);
  grids.create(world);

  const fragments = components.get(OBC.FragmentsManager);
  const workerUrl = await OBC.FragmentsManager.getWorker();
  fragments.init(workerUrl);

  const ifcLoader = components.get(OBC.IfcLoader);
  await ifcLoader.setup({ autoSetWasm: false, wasm: { path: 'https://unpkg.com/web-ifc@0.0.77/', absolute: true } });

  setStatus('Sťahujem model z Google Drive...');
  const url = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&supportsAllDrives=true&key=${DRIVE_API_KEY}`;
  let resp;
  try {
    resp = await fetch(url);
  } catch (e) {
    setStatus('Model sa nepodarilo stiahnuť (sieťová chyba).', true);
    return;
  }
  if (!resp.ok) {
    setStatus(resp.status === 404
      ? 'Model sa nenašiel — možno bolo zrušené zdieľanie súboru.'
      : 'Model sa nepodarilo stiahnuť (chyba ' + resp.status + ').', true);
    return;
  }
  const buf = new Uint8Array(await resp.arrayBuffer());

  setStatus('Spracúvam model (môže trvať pri veľkých súboroch)...');

  let model;
  fragments.list.onItemSet.add(({ value: m }) => {
    m.useCamera(world.camera.three);
    world.scene.three.add(m.object);
    fragments.core.update(true);
  });
  try {
    model = await ifcLoader.load(buf, false, 'model');
  } catch (e) {
    setStatus('Model sa nepodarilo spracovať: ' + e.message, true);
    return;
  }

  // Počkaj kým geometria dotečie z workera (asynchrónne, nezávislé od load() promise)
  let lastCount = -1, stableRounds = 0;
  for (let i = 0; i < 40 && stableRounds < 3; i++) {
    await new Promise(r => setTimeout(r, 300));
    const n = model.object.children.length;
    if (n === lastCount) stableRounds++; else stableRounds = 0;
    lastCount = n;
  }

  let itemGeomMap = null; // {localId: [{positions,indices,transform,...}]} — zdieľané medzi hranami a rezovou čiarou

  // Jemné hranové čiary, outline pre každý predmet/objem (architektonický vzhľad).
  // DÔLEŽITÉ: nemôže sa počítať z raw mesh position/index dát — Fragments zlučuje veľa
  // IFC položiek do jedného Mesh-u a per-položkovú transformáciu aplikuje až v custom
  // vertex shaderi (onBeforeCompile), takže surové súradnice sú v "šablónovom" priestore
  // pred touto transformáciou (skúšané, výsledné čiary boli viditeľne mimo modelu).
  // Správne: model.getItemsGeometry(ids) vráti za každú položku {positions,indices,transform},
  // transform sa aplikuje na vypočítanú EdgesGeometry priamo (nie na mesh).
  try {
    const EDGE_DENSITY_CAP = 4000; // segmentov na položku — nad tento počet ide o "príliš husté" (zaoblená plocha), vynechať
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x1a1614, transparent: true, opacity: 0.6 });

    // Čiary ležia presne na povrchu -> z-fighting s vlastnou plochou modelu (blikanie/
    // miznutie podľa uhla kamery). Štandardná oprava: posunúť plochu v hĺbkovom bufferi
    // mierne dozadu (polygonOffset), aby čiary vždy vyhrali.
    model.object.traverse(obj => {
      if (!obj.isMesh) return;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => { if (m) { m.polygonOffset = true; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1; } });
    });

    const ids = await model.getItemsIdsWithGeometry();
    const geomMap = await model.getItemsGeometry(ids);
    itemGeomMap = geomMap;
    for (const localId in geomMap) {
      for (const piece of geomMap[localId]) {
        if (!piece.positions || !piece.indices || !piece.transform) continue;
        try {
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(piece.positions, 3));
          g.setIndex(Array.from(piece.indices));
          // Nízky prah (1°) = outline pre každú zmenu plochy, nielen ostré rohy — presne
          // to Jozef chcel ("úplne každý predmet/objem"). Výnimka: veľmi husto tesselované
          // plochy (zaoblenia/oblúky) by pri takomto prahu dali stovky nezmyselných čiar.
          const eg = new THREE.EdgesGeometry(g, 1);
          if (eg.attributes.position.count / 2 > EDGE_DENSITY_CAP) continue;
          eg.applyMatrix4(piece.transform);
          model.object.add(new THREE.LineSegments(eg, edgeMat));
        } catch (e) {}
      }
    }
  } catch (e) {}

  try {
    const box = new THREE.Box3().setFromObject(model.object);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length() || 20;
    world.camera.controls.setLookAt(center.x + size, center.y + size, center.z + size, center.x, center.y, center.z);
  } catch (e) {}

  hideStatus();
  document.getElementById('panel').style.display = '';

  // Rezy
  const clipper = components.get(OBC.Clipper);
  clipper.enabled = true;

  // Hrubá rezová čiara (architektonický štandard — miesto, kde rovina reže konštrukciu,
  // má mať výraznú, hrubú čiaru, nie len "dieru"). Clipper sám o sebe žiadnu takú
  // funkciu nemá (len WebGL clippingPlanes), preto sa prienik roviny s modelom počíta
  // ručne z rovnakých per-položkových dát ako hranové čiary (itemGeomMap).
  let cutLines = [];
  const { Line2 } = await import('three/addons/lines/Line2.js');
  const { LineGeometry } = await import('three/addons/lines/LineGeometry.js');
  const { LineMaterial } = await import('three/addons/lines/LineMaterial.js');
  const cutLineMat = new LineMaterial({ color: 0x000000, linewidth: 3, worldUnits: false });
  cutLineMat.resolution.set(window.innerWidth, window.innerHeight);
  window.addEventListener('resize', () => cutLineMat.resolution.set(window.innerWidth, window.innerHeight));

  // 1cm tolerancia — trojuholníky takmer v rovine rezu (napr. stena takmer rovnobežná
  // s rovinou) sú numericky nestabilné: plávajúca čiarka spôsobí, že sa striedavo javia
  // ako "nad"/"pod" rovinou pozdĺž celej plochy, čo vytvorí hustú čmáranicu namiesto
  // jednej čistej čiary (nahlásené Jozefom — "hádže čiary aj tam kde nemá"). Takéto
  // takmer-koplanárne trojuholníky sa preto rovno preskočia, žiadny rez sa pre ne nepočíta.
  const CUT_EPS = 0.01;
  function trianglePlaneIntersect(plane, a, b, c, out) {
    const da = plane.distanceToPoint(a);
    const db = plane.distanceToPoint(b);
    const dc = plane.distanceToPoint(c);
    if (Math.abs(da) < CUT_EPS && Math.abs(db) < CUT_EPS && Math.abs(dc) < CUT_EPS) return;
    const sa = da > CUT_EPS ? 1 : da < -CUT_EPS ? -1 : 0;
    const sb = db > CUT_EPS ? 1 : db < -CUT_EPS ? -1 : 0;
    const sc = dc > CUT_EPS ? 1 : dc < -CUT_EPS ? -1 : 0;
    if (sa >= 0 && sb >= 0 && sc >= 0) return; // celý trojuholník na jednej strane (vrátane "na rovine")
    if (sa <= 0 && sb <= 0 && sc <= 0) return;

    const pts = [];
    const edges = [[a,b],[b,c],[c,a]];
    for (const [p1,p2] of edges) {
      const pt = new THREE.Vector3();
      if (plane.intersectLine(new THREE.Line3(p1,p2), pt)) {
        if (!pts.some(e => e.distanceToSquared(pt) < 1e-8)) pts.push(pt.clone());
      }
    }
    if (pts.length === 2) { out.push(pts[0].x,pts[0].y,pts[0].z, pts[1].x,pts[1].y,pts[1].z); }
  }

  function refreshCutLines() {
    cutLines.forEach(l => { world.scene.three.remove(l); l.geometry.dispose(); });
    cutLines = [];
    if (!itemGeomMap) return;
    // Rovina rezu je matematicky nekonečná — bez tohto obmedzenia sa cez otvorený
    // priestor (schodisko/atrium) premietnu na to isté miesto na obrazovke aj rezy
    // ďalšími podlažiami/stenami hlboko v budove (nahlásené Jozefom ako "čmáranica" —
    // v skutočnosti reálne, len vzdialené a navzájom prekryté rezy). Obmedziť len na
    // rozumnú oblasť okolo miesta, kde bol rez vytvorený.
    const modelSize = new THREE.Box3().setFromObject(model.object).getSize(new THREE.Vector3()).length();
    const maxCutDist = Math.max(modelSize * 0.15, 5);
    const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3(), centroid = new THREE.Vector3();
    for (const [, planeEntry] of clipper.list) {
      const plane = planeEntry.three;
      const origin = planeEntry.origin;
      if (!plane) continue;
      const segs = [];
      for (const localId in itemGeomMap) {
        for (const piece of itemGeomMap[localId]) {
          if (!piece.positions || !piece.indices || !piece.transform) continue;
          const pos = piece.positions, idx = piece.indices;
          const m = piece.transform;
          for (let i = 0; i < idx.length; i += 3) {
            const ia = idx[i]*3, ib = idx[i+1]*3, ic = idx[i+2]*3;
            va.set(pos[ia],pos[ia+1],pos[ia+2]).applyMatrix4(m);
            vb.set(pos[ib],pos[ib+1],pos[ib+2]).applyMatrix4(m);
            vc.set(pos[ic],pos[ic+1],pos[ic+2]).applyMatrix4(m);
            if (origin) {
              centroid.set((va.x+vb.x+vc.x)/3, (va.y+vb.y+vc.y)/3, (va.z+vb.z+vc.z)/3);
              if (centroid.distanceTo(origin) > maxCutDist) continue;
            }
            trianglePlaneIntersect(plane, va, vb, vc, segs);
          }
        }
      }
      if (segs.length) {
        const lg = new LineGeometry();
        lg.setPositions(segs);
        const line = new Line2(lg, cutLineMat);
        world.scene.three.add(line);
        cutLines.push(line);
      }
    }
  }

  window.addEventListener('dblclick', async (e) => {
    if (e.target.closest('.panel')) return;
    const plane = await clipper.create(world);
    if (plane) { plane.onDraggingEnded?.add(refreshCutLines); refreshCutLines(); }
  });
  window.addEventListener('keydown', async (e) => {
    if (e.key === 'Delete' || e.key === 'Backspace') { await clipper.delete(world); refreshCutLines(); }
  });
  document.getElementById('btnClearClip').onclick = () => { clipper.deleteAll(); refreshCutLines(); };

  // Vrstvy (IFC kategórie)
  try {
    const classifier = components.get(OBC.Classifier);
    await classifier.byCategory({ models: [model] });
    const catMap = classifier.list.get('Categories');
    const cats = catMap ? [...catMap.keys()].sort() : [];
    const hider = components.get(OBC.Hider);
    const catsEl = document.getElementById('cats');
    for (const cat of cats) {
      const b = document.createElement('button');
      b.className = 'pbtn';
      b.textContent = cat.replace(/^IFC/, '');
      b.onclick = async () => {
        const gd = classifier.getGroupData('Categories', cat);
        const resolvedMap = await gd.get();
        const vis = b.classList.contains('hidden-cat');
        await hider.set(vis, resolvedMap);
        b.classList.toggle('hidden-cat', !vis);
      };
      catsEl.appendChild(b);
    }
  } catch (e) {
    // vrstvy sú len doplnková funkcia — chyba tu nesmie zhodiť celý viewer
  }
}

main().catch(e => setStatus('Nastala neočakávaná chyba: ' + e.message, true));
</script>
</body>
</html>
