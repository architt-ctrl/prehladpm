<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vyjadrenia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232c2825'/%3E%3Cpath fill-rule='evenodd' fill='%23f5f3ef' d='M28.4 22.9L28.4 15.9L6.7 15.9L6.7 22.9L13.6 22.9L13.6 48.1L21.5 48.1L21.5 22.9M47.1 40.9L49.4 48.1L57.3 48.1L46.2 15.9L37.9 15.9L26.8 48.1L34.7 48.1L37 40.9M45.1 34.4L39 34.4L42.1 24.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f5f3ef; --bg2:#fff; --bg3:#f0ede8;
      --border:#e4dfd8;
      --text:#2c2825; --text2:#6b6460; --text3:#9e9590;
      --green:#1e7a4a; --grn-bg:#f0faf5; --grn-bd:#b8e6cc;
      --blue:#1a5fa0; --blu-bg:#f0f6fd; --blu-bd:#b8d4f0;
      --red:#c0392b; --red-bg:#fdf2f1; --red-bd:#f5c6c2;
      --orange:#c96a1a; --ora-bg:#fdf4ec; --ora-bd:#f0d4b8;
      --sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased}

    .top{background:var(--text);color:#f5f3ef;padding:10px 20px;display:flex;align-items:center;gap:16px}
    .top-logo-img{height:36px;width:auto;flex-shrink:0;display:block;filter:invert(1)}
    .top-info{display:flex;flex-direction:column;gap:2px;min-width:0}
    .top-proj{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-sub{font-size:12px;color:rgba(245,243,239,.55)}

    .main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
    .empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:14px;line-height:1.6}
    .empty .err{color:var(--red)}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
    .card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .organ{font-size:14px;font-weight:600}
    .cislo-vyj{display:block;font-weight:400;color:var(--text3);font-size:12px;margin-top:2px}
    .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0}
    .b-suhlasne{background:var(--grn-bg);border:1px solid var(--grn-bd);color:var(--green)}
    .b-podmienecne{background:var(--ora-bg);border:1px solid var(--ora-bd);color:var(--orange)}
    .b-zamietave{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
    .b-neutralne{background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
    .meta{font-size:12px;color:var(--text3);margin-top:2px}
    .meta .late{color:var(--red);font-weight:700}
    .meta .soon{color:var(--orange);font-weight:700}
    .kontakt{font-size:12px;color:var(--text3);margin-top:4px}
    .kontakt a{color:var(--blue);text-decoration:none}
    .zhrnutie{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5}
    .pr-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:8px;user-select:none;display:inline-block}
    .pr-list{margin:6px 0 0 0;padding:0;font-size:13px;color:var(--text2);line-height:1.5}
    .pr-list li{list-style:none;display:flex;gap:7px;margin-bottom:6px}
    .pr-mark{flex-shrink:0;margin-top:1px}
    .pr-done{text-decoration:line-through;color:var(--text3)}
    .pr-typ{font-size:9px;font-weight:600;padding:1px 6px;border-radius:7px;background:var(--bg3);flex-shrink:0;white-space:nowrap;align-self:flex-start}
    .pr-typ-projekt{border:1px solid var(--blue);color:var(--blue)}
    .pr-typ-realizacia{border:1px solid var(--border);color:var(--text3)}
    .b-pd-pending{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
    .b-pd-done{background:var(--grn-bg);border:1px solid var(--grn-bd);color:var(--green)}
    .file-link{font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:8px}
    .file-link:hover{text-decoration:underline}
    .pozn-list{margin:6px 0 0 0}
    .pozn-item{font-size:12px;color:var(--text2);padding:3px 0;border-top:1px solid var(--border);display:flex;gap:6px}
    .pozn-date{color:var(--text3);flex-shrink:0;font-size:11px}
    .upload-card{max-width:720px;margin:16px auto 0;padding:0 16px}
    .upload-inner{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
    .upload-title{font-size:13px;font-weight:600;margin-bottom:8px}
    .upload-btn{background:var(--text);color:#f5f3ef;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
    .upload-btn:disabled{opacity:.5;cursor:default}
    .upload-status{font-size:12px;color:var(--text2);margin-top:8px}
    .upload-status.err{color:var(--red)}
    .upload-status.ok{color:var(--green)}
  </style>
</head>
<body>

<div class="top">
  <img class="top-logo-img" src="logo-tornyos-wide.png" alt="Tornyos Architects">
  <div class="top-info">
    <div class="top-proj" id="topProj"></div>
    <div class="top-sub">Vyjadrenia a stanoviská</div>
  </div>
</div>

<div class="upload-card" id="uploadCard" style="display:none">
  <div class="upload-inner">
    <div class="upload-title">Nahrať nové vyjadrenie</div>
    <input type="file" id="uploadFile" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif" capture="environment" style="display:none" onchange="onUploadFile()">
    <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('uploadFile').click()">📤 Vybrať súbor a nahrať</button>
    <div class="upload-status" id="uploadStatus"></div>
  </div>
</div>

<div class="main" id="main">
  <div class="empty" id="loading">Načítavam…</div>
</div>

<script>
const SB_URL = 'https://cfjkomqxzqflotrqxfyl.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmamtvbXF4enFmbG90cnF4ZnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NTM1NjksImV4cCI6MjA5MzUyOTU2OX0.GUnw0I0wDrkIwaJ15TnpF_8zghW_8yIM_MZlyLF1dH8';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const params = new URLSearchParams(location.search);
const cislo = params.get('cislo');
const nazov = params.get('nazov');
const singleId = params.get('id'); // odkaz na jedno konkrétne vyjadrenie - nerozbaľuje sa, všetko rovno vidno
document.getElementById('topProj').textContent = [cislo, nazov].filter(Boolean).join(' – ');

const openSet = new Set();
const noteOpenSet = new Set();
let rows = [];
let notesByVyjadrenie = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Staré záznamy (spred zavedenia checkboxu/komentára) majú pripomienky ako holé reťazce.
function normPripomienka(p) {
  return (typeof p === 'string') ? { text: p, done: false, komentar: '' } : (p || { text: '', done: false, komentar: '' });
}

function badgeHtml(stav) {
  if (!stav) return '';
  const cls = { 'súhlasné':'b-suhlasne', 'podmienečné':'b-podmienecne', 'zamietavé':'b-zamietave', 'neutrálne':'b-neutralne' }[stav] || 'b-neutralne';
  return `<span class="badge ${cls}">${esc(stav)}</span>`;
}

function dlClass(termin) {
  if (!termin) return '';
  const d = Math.floor((new Date(termin) - new Date()) / 86400000);
  return d < 0 ? 'late' : d <= 14 ? 'soon' : '';
}

function pripomienkaTypBadge(typ) {
  if (typ === 'projekt') return `<span class="pr-typ pr-typ-projekt">PD</span>`;
  if (typ === 'realizacia') return `<span class="pr-typ pr-typ-realizacia">Realizácia</span>`;
  return '';
}

function pripomienkyHtml(pripomienky) {
  if (!pripomienky.length) return '';
  return `<ul class="pr-list">${pripomienky.map(p => {
    const n = normPripomienka(p);
    return `<li><span class="pr-mark">${n.done ? '☑' : '☐'}</span><span class="${n.done ? 'pr-done' : ''}" style="flex:1">${esc(n.text)}</span>${pripomienkaTypBadge(n.typ)}</li>`;
  }).join('')}</ul>`;
}

// Stav pripomienok typu "projekt" (pozri index.html vyjadreniePdStatus) - null/'pending'/'done'.
function pdStatus(r) {
  const pripomienky = Array.isArray(r.pripomienky) ? r.pripomienky : [];
  const pdItems = pripomienky.map(normPripomienka).filter(p => p.typ === 'projekt');
  if (!pdItems.length) return null;
  return pdItems.every(p => p.done) ? 'done' : 'pending';
}

function pdStatusBadge(status) {
  if (status === 'pending') return `<span class="badge b-pd-pending" style="margin-left:auto">⚠ Vyžaduje dopracovanie PD</span>`;
  if (status === 'done') return `<span class="badge b-pd-done" style="margin-left:auto">✓ Pripomienky zapracované</span>`;
  return '';
}

function fmtDate(iso) {
  const dt = new Date(iso);
  return dt.getDate() + '.' + (dt.getMonth() + 1) + '.' + dt.getFullYear();
}

function poznamkyHtml(notes) {
  return `<div class="pozn-list">${notes.map(n => `<div class="pozn-item"><span class="pozn-date">${fmtDate(n.created_at)}</span><span>${esc(n.text)}</span></div>`).join('')}</div>`;
}

function toggleNotesOpen(id) {
  if (noteOpenSet.has(id)) noteOpenSet.delete(id); else noteOpenSet.add(id);
  render();
}

// Rovnaká logika ako sortVyjadrenia v index.html - musí ostať zhodná, inak sa poradie v zdieľanom
// linku rozíde s interným modálom. Pripnuté > vyžaduje dopracovanie PD (podľa najbližšieho termínu)
// > pripomienky zapracované > ostatné podľa dátumu dokumentu zostupne.
function sortVyjadrenia(list) {
  const rank = r => {
    if (r.pripnute) return 0;
    const st = pdStatus(r);
    if (st === 'pending') return 1;
    if (st === 'done') return 2;
    return 3;
  };
  return list.slice().sort((a, b) => {
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 1) return (a.termin_reakcie || '9999-99-99').localeCompare(b.termin_reakcie || '9999-99-99');
    return (b.datum_dokumentu || '').localeCompare(a.datum_dokumentu || '');
  });
}

function render() {
  const main = document.getElementById('main');
  if (!rows.length) {
    main.innerHTML = singleId
      ? '<div class="empty err">Toto vyjadrenie sa nenašlo (odkaz už možno nie je platný).</div>'
      : '<div class="empty">Zatiaľ žiadne vyjadrenia ani stanoviská k tomuto projektu.</div>';
    return;
  }
  main.innerHTML = rows.map(r => {
    const pripomienky = Array.isArray(r.pripomienky) ? r.pripomienky : [];
    const notes = notesByVyjadrenie[r.id] || [];
    const open = singleId ? true : openSet.has(r.id);
    const notesOpen = singleId ? true : noteOpenSet.has(r.id);
    return `<div class="card">
      <div class="card-head">
        <span class="organ">${esc(r.organ || 'Neznámy pôvodca')}</span>
        ${badgeHtml(r.stav)}
        ${pdStatusBadge(pdStatus(r))}
      </div>
      ${r.cislo_vyjadrenia ? `<div class="cislo-vyj">č. ${esc(r.cislo_vyjadrenia)}</div>` : ''}
      <div class="meta">
        ${r.datum_dokumentu ? 'Dokument: ' + esc(r.datum_dokumentu) : ''}
        ${r.termin_reakcie ? `<span class="${dlClass(r.termin_reakcie)}">${r.datum_dokumentu ? ' · ' : ''}Termín: ${esc(r.termin_reakcie)}</span>` : ''}
      </div>
      ${r.kontakt || r.kontakt_email ? `<div class="kontakt">👤 ${esc(r.kontakt || '')}${r.kontakt_email ? ` · <a href="mailto:${esc(r.kontakt_email)}">✉️ ${esc(r.kontakt_email)}</a>` : ''}</div>` : ''}
      ${r.zhrnutie ? `<div class="zhrnutie">${esc(r.zhrnutie)}</div>` : ''}
      ${pripomienky.length ? (singleId
        ? pripomienkyHtml(pripomienky)
        : `<div class="pr-toggle" onclick="toggleOpen('${r.id}')">${open ? '▾' : '▸'} Pripomienky (${pripomienky.length})</div>${open ? pripomienkyHtml(pripomienky) : ''}`
      ) : ''}
      ${notes.length ? (singleId
        ? poznamkyHtml(notes)
        : `<div class="pr-toggle" onclick="toggleNotesOpen('${r.id}')">${notesOpen ? '▾' : '▸'} Poznámky (${notes.length})</div>${notesOpen ? poznamkyHtml(notes) : ''}`
      ) : ''}
      ${r.file_url ? `<a class="file-link" href="${esc(r.file_url)}" target="_blank">📎 Otvoriť oficiálny dokument</a>` : ''}
    </div>`;
  }).join('');
}

function toggleOpen(id) {
  if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
  render();
}

async function loadData() {
  const query = sb.from('project_vyjadrenia').select('*');
  const { data, error } = singleId
    ? await query.eq('id', singleId)
    : await query.eq('cislo', cislo).order('datum_dokumentu', { ascending: false });
  if (error) throw error;
  rows = sortVyjadrenia(data || []);
  const ids = rows.map(r => r.id);
  notesByVyjadrenie = {};
  if (ids.length) {
    const { data: notes } = await sb.from('vyjadrenie_poznamky').select('vyjadrenie_id,text,created_at').in('vyjadrenie_id', ids).order('created_at', { ascending: false });
    ids.forEach(id => { notesByVyjadrenie[id] = []; });
    (notes || []).forEach(n => notesByVyjadrenie[n.vyjadrenie_id].push(n));
  }
}

async function init() {
  if (!cislo) {
    document.getElementById('main').innerHTML = '<div class="empty err">Chýba číslo projektu v odkaze.</div>';
    return;
  }
  document.getElementById('uploadCard').style.display = 'block';
  try {
    await loadData();
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = '<div class="empty err">Nepodarilo sa načítať: ' + esc(e.message) + '</div>';
  }
}
init();

// ── Nahratie nového vyjadrenia (investor/projektant, bez loginu) ───────────
// Apps Script natvrdo v kóde (táto stránka nemá prístup k appke ⚙ Nastaveniam) - rovnaká URL
// ako "Gemini Apps Script URL" v index.html. Uploadnutý súbor sa na serveri hneď spracuje
// (OCR+Gemini) cez rovnakú akciu ako "🔄 Skontrolovať teraz" v internom modáli.
const VYJADRENIA_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzt3J4mCogYQWP4UVIplGxfVoTyxh09ctj2n88Tzi1co8PX6XIGR58bq3AY8sJYueXd/exec';

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('Súbor sa nepodarilo prečítať'));
    reader.readAsDataURL(file);
  });
}

async function onUploadFile() {
  const inp = document.getElementById('uploadFile');
  const file = inp.files[0];
  if (!file) return;
  const statusEl = document.getElementById('uploadStatus');
  const btn = document.getElementById('uploadBtn');
  const reset = () => { inp.value = ''; btn.disabled = false; };
  if (!VYJADRENIA_APPS_SCRIPT_URL || VYJADRENIA_APPS_SCRIPT_URL === 'PLACEHOLDER_SET_BY_JOZEF') {
    statusEl.textContent = 'Nahrávanie zatiaľ nie je nastavené — kontaktujte architt.';
    statusEl.className = 'upload-status err';
    reset();
    return;
  }
  const MAX_SIZE = 15 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    statusEl.textContent = 'Súbor je príliš veľký (max 15 MB).';
    statusEl.className = 'upload-status err';
    reset();
    return;
  }
  btn.disabled = true;
  statusEl.textContent = 'Nahrávam „' + file.name + '"…';
  statusEl.className = 'upload-status';
  try {
    const fileBase64 = await fileToBase64(file);
    // Spracovanie (OCR+Gemini) môže trvať dlhšie a doručenie odpovede cez Apps Script /exec
    // presmerovanie je pri dlhších behoch nespoľahlivé (rovnaký gotcha ako scanVyjadreniaTeraz
    // v index.html) - preto sa na fetch() odpoveď nespolieha, len sa spustí a výsledok sa
    // priebežne dotiahne zo Supabase.
    fetch(VYJADRENIA_APPS_SCRIPT_URL, {
      method: 'POST', cache: 'no-store',
      body: JSON.stringify({ action: 'uploadVyjadrenie', cislo, fileName: file.name, mimeType: file.type, fileBase64 })
    }).then(r => r.json()).then(d => {
      if (d && !d.ok) console.log('uploadVyjadrenie zlyhalo:', d.error);
      if (d && d.errors && d.errors.length) console.log('uploadVyjadrenie errors:', d.errors);
    }).catch(e => console.log('uploadVyjadrenie - odpoveď sa nedoručila (očakávané, výsledok sa číta zo Supabase):', e.message));

    statusEl.textContent = 'Súbor sa spracúva, môže to trvať aj minútu…';
    const oneskorenia = [8000, 15000, 20000, 20000];
    for (const ms of oneskorenia) {
      await new Promise(res => setTimeout(res, ms));
      await loadData();
      render();
    }
    statusEl.textContent = 'Hotovo — vyjadrenie by malo byť v zozname nižšie.';
    statusEl.className = 'upload-status ok';
  } catch(e) {
    statusEl.textContent = 'Chyba: ' + e.message;
    statusEl.className = 'upload-status err';
  } finally {
    reset();
  }
}
</script>
</body>
</html>
