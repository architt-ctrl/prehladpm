<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vyjadrenia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232c2825'/%3E%3Cpath fill-rule='evenodd' fill='%23f5f3ef' d='M28.4 22.9L28.4 15.9L6.7 15.9L6.7 22.9L13.6 22.9L13.6 48.1L21.5 48.1L21.5 22.9M47.1 40.9L49.4 48.1L57.3 48.1L46.2 15.9L37.9 15.9L26.8 48.1L34.7 48.1L37 40.9M45.1 34.4L39 34.4L42.1 24.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f5f3ef; --bg2:#fff; --bg3:#f0ede8;
      --border:#e4dfd8;
      --text:#2c2825; --text2:#6b6460; --text3:#9e9590;
      --green:#1e7a4a; --grn-bg:#f0faf5; --grn-bd:#b8e6cc;
      --blue:#1a5fa0; --blu-bg:#f0f6fd; --blu-bd:#b8d4f0;
      --red:#c0392b; --red-bg:#fdf2f1; --red-bd:#f5c6c2;
      --orange:#c96a1a; --ora-bg:#fdf4ec; --ora-bd:#f0d4b8;
      --sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased}

    .top{background:var(--text);color:#f5f3ef;padding:10px 20px;display:flex;align-items:center;gap:16px}
    .top-logo-img{height:36px;width:auto;flex-shrink:0;display:block;filter:invert(1)}
    .top-info{display:flex;flex-direction:column;gap:2px;min-width:0}
    .top-proj{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-sub{font-size:12px;color:rgba(245,243,239,.55)}

    .main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
    .empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:14px;line-height:1.6}
    .empty .err{color:var(--red)}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
    .card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .organ{font-size:14px;font-weight:600}
    .cislo-vyj{display:block;font-weight:400;color:var(--text3);font-size:12px;margin-top:2px}
    .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0}
    .b-suhlasne{background:var(--grn-bg);border:1px solid var(--grn-bd);color:var(--green)}
    .b-podmienecne{background:var(--ora-bg);border:1px solid var(--ora-bd);color:var(--orange)}
    .b-zamietave{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
    .b-neutralne{background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
    .meta{font-size:12px;color:var(--text3);margin-top:2px}
    .meta .late{color:var(--red);font-weight:700}
    .meta .soon{color:var(--orange);font-weight:700}
    .kontakt{font-size:12px;color:var(--text3);margin-top:4px}
    .kontakt a{color:var(--blue);text-decoration:none}
    .zhrnutie{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5}
    .pr-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:8px;user-select:none;display:inline-block}
    .pr-list{margin:6px 0 0 0;padding:0;font-size:13px;color:var(--text2);line-height:1.5}
    .pr-list li{list-style:none;display:flex;gap:7px;margin-bottom:6px}
    .pr-mark{flex-shrink:0;margin-top:1px}
    .pr-done{text-decoration:line-through;color:var(--text3)}
    .pr-komentar{font-size:11px;color:var(--text3);margin-top:1px}
    .file-link{font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:8px}
    .file-link:hover{text-decoration:underline}
  </style>
</head>
<body>

<div class="top">
  <img class="top-logo-img" src="logo-tornyos-wide.png" alt="Tornyos Architects">
  <div class="top-info">
    <div class="top-proj" id="topProj"></div>
    <div class="top-sub">Vyjadrenia a stanoviská</div>
  </div>
</div>

<div class="main" id="main">
  <div class="empty" id="loading">Načítavam…</div>
</div>

<script>
const SB_URL = 'https://cfjkomqxzqflotrqxfyl.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmamtvbXF4enFmbG90cnF4ZnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NTM1NjksImV4cCI6MjA5MzUyOTU2OX0.GUnw0I0wDrkIwaJ15TnpF_8zghW_8yIM_MZlyLF1dH8';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const params = new URLSearchParams(location.search);
const cislo = params.get('cislo');
const nazov = params.get('nazov');
const singleId = params.get('id'); // odkaz na jedno konkrétne vyjadrenie - nerozbaľuje sa, všetko rovno vidno
document.getElementById('topProj').textContent = [cislo, nazov].filter(Boolean).join(' – ');

const openSet = new Set();
let rows = [];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Staré záznamy (spred zavedenia checkboxu/komentára) majú pripomienky ako holé reťazce.
function normPripomienka(p) {
  return (typeof p === 'string') ? { text: p, done: false, komentar: '' } : (p || { text: '', done: false, komentar: '' });
}

function badgeHtml(stav) {
  if (!stav) return '';
  const cls = { 'súhlasné':'b-suhlasne', 'podmienečné':'b-podmienecne', 'zamietavé':'b-zamietave', 'neutrálne':'b-neutralne' }[stav] || 'b-neutralne';
  return `<span class="badge ${cls}">${esc(stav)}</span>`;
}

function dlClass(termin) {
  if (!termin) return '';
  const d = Math.floor((new Date(termin) - new Date()) / 86400000);
  return d < 0 ? 'late' : d <= 14 ? 'soon' : '';
}

function pripomienkyHtml(pripomienky) {
  if (!pripomienky.length) return '';
  return `<ul class="pr-list">${pripomienky.map(p => {
    const n = normPripomienka(p);
    return `<li><span class="pr-mark">${n.done ? '☑' : '☐'}</span><span>
      <span class="${n.done ? 'pr-done' : ''}">${esc(n.text)}</span>
      ${n.komentar ? `<div class="pr-komentar">💬 ${esc(n.komentar)}</div>` : ''}
    </span></li>`;
  }).join('')}</ul>`;
}

function render() {
  const main = document.getElementById('main');
  if (!rows.length) {
    main.innerHTML = singleId
      ? '<div class="empty err">Toto vyjadrenie sa nenašlo (odkaz už možno nie je platný).</div>'
      : '<div class="empty">Zatiaľ žiadne vyjadrenia ani stanoviská k tomuto projektu.</div>';
    return;
  }
  main.innerHTML = rows.map(r => {
    const pripomienky = Array.isArray(r.pripomienky) ? r.pripomienky : [];
    const open = singleId ? true : openSet.has(r.id);
    return `<div class="card">
      <div class="card-head">
        <span class="organ">${esc(r.organ || 'Neznámy pôvodca')}</span>
        ${badgeHtml(r.stav)}
      </div>
      ${r.cislo_vyjadrenia ? `<div class="cislo-vyj">č. ${esc(r.cislo_vyjadrenia)}</div>` : ''}
      <div class="meta">
        ${r.datum_dokumentu ? 'Dokument: ' + esc(r.datum_dokumentu) : ''}
        ${r.termin_reakcie ? `<span class="${dlClass(r.termin_reakcie)}">${r.datum_dokumentu ? ' · ' : ''}Termín: ${esc(r.termin_reakcie)}</span>` : ''}
      </div>
      ${r.kontakt || r.kontakt_email ? `<div class="kontakt">👤 ${esc(r.kontakt || '')}${r.kontakt_email ? ` · <a href="mailto:${esc(r.kontakt_email)}">✉️ ${esc(r.kontakt_email)}</a>` : ''}</div>` : ''}
      ${r.zhrnutie ? `<div class="zhrnutie">${esc(r.zhrnutie)}</div>` : ''}
      ${pripomienky.length ? (singleId
        ? pripomienkyHtml(pripomienky)
        : `<div class="pr-toggle" onclick="toggleOpen('${r.id}')">${open ? '▾' : '▸'} Pripomienky (${pripomienky.length})</div>${open ? pripomienkyHtml(pripomienky) : ''}`
      ) : ''}
      ${r.file_url ? `<a class="file-link" href="${esc(r.file_url)}" target="_blank">📎 Otvoriť oficiálny dokument</a>` : ''}
    </div>`;
  }).join('');
}

function toggleOpen(id) {
  if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
  render();
}

async function init() {
  if (!cislo) {
    document.getElementById('main').innerHTML = '<div class="empty err">Chýba číslo projektu v odkaze.</div>';
    return;
  }
  const query = sb.from('project_vyjadrenia').select('*');
  const { data, error } = singleId
    ? await query.eq('id', singleId)
    : await query.eq('cislo', cislo).order('datum_dokumentu', { ascending: false });
  if (error) {
    document.getElementById('main').innerHTML = '<div class="empty err">Nepodarilo sa načítať: ' + esc(error.message) + '</div>';
    return;
  }
  rows = data || [];
  render();
}
init();
</script>
</body>
</html>
